name: Build
on: [push, pull_request]
jobs:
  build:
    name: >-
      ${{ matrix.os }} ruby ${{ matrix.ruby }} ${{ matrix.db }}
    runs-on: ${{ matrix.os }}
    # Empty/unset for every entry except the Fedora ones below, where it
    # points the whole job at a Fedora image instead of running directly on
    # the ubuntu-24.04 host -- Fedora isn't offered as a native runner OS.
    container: ${{ matrix.container }}
    continue-on-error: ${{ matrix.allow-failure || false }}
    strategy:
      matrix:
        include:
          # Ruby 3.x / 4.x on Ubuntu 24.04 LTS
          - {os: ubuntu-24.04, ruby: 'head', db: mysql97}
          - {os: ubuntu-24.04, ruby: '4.0', db: mysql97}
          - {os: ubuntu-24.04, ruby: '4.0', db: mysql84}
          - {os: ubuntu-24.04, ruby: '3.4', db: mysql84}

          # Ruby 3.x on Ubuntu 22.04 LTS
          - {os: ubuntu-22.04, ruby: '3.4', db: mysql80}
          - {os: ubuntu-22.04, ruby: '3.3', db: mysql80}
          - {os: ubuntu-22.04, ruby: '3.2', db: mysql80}
          - {os: ubuntu-22.04, ruby: '3.1', db: mysql80}
          - {os: ubuntu-22.04, ruby: '3.0', db: mysql80}

          # Ruby 2.x on Ubuntu 22.04 LTS
          - {os: ubuntu-22.04, ruby: '2.7', db: mysql80}

          # MySQL 5.7 packages stopped after Ubuntu 18.04 Bionic
          # - {os: ubuntu-18.04, ruby: '2.7', db: mysql57}

          # MariaDB LTS versions
          # db: on Linux, ci/setup.sh installs the specified packages
          # db: on MacOS, installs a Homebrew package use "name@X.Y" to specify a version

          - {os: ubuntu-24.04, ruby: '4.0', db: mariadb12.3}
          - {os: ubuntu-24.04, ruby: '3.4', db: mariadb12.3}
          - {os: ubuntu-24.04, ruby: '4.0', db: mariadb11.8}
          - {os: ubuntu-24.04, ruby: '3.4', db: mariadb11.8}
          - {os: ubuntu-24.04, ruby: '4.0', db: mariadb11.4}
          - {os: ubuntu-24.04, ruby: '3.4', db: mariadb11.4}
          - {os: ubuntu-22.04, ruby: '3.0', db: mariadb10.11}
          - {os: ubuntu-22.04, ruby: '2.7', db: mariadb10.11}
          - {os: ubuntu-22.04, ruby: '3.0', db: mariadb10.6}

          # TODO - Windows CI
          # - {os: windows-2022, ruby: '3.2', db: mysql80}
          # - {os: windows-2022, ruby: '2.7', db: mysql80}

          # Fedora, which GitHub doesn't offer as a native runner OS -- these
          # run inside a container on the ubuntu-24.04 host instead (see the
          # job-level `container:` above). ci/fedora.sh does the distro-side
          # setup that ci/setup.sh does for the native-runner entries above,
          # including installing Ruby itself via dnf: ruby/setup-ruby's
          # prebuilt binary can't find its own shared libraries when dropped
          # into a still-bare container (nothing's been dnf-installed yet at
          # that point in the job), so these rows test whatever Ruby version
          # Fedora currently packages rather than a chosen version.
          - {os: ubuntu-24.04, ruby: 'system', db: 'fedora:latest', distro: fedora, container: {image: 'fedora:latest', options: '--cap-add=SYS_PTRACE --security-opt seccomp=unconfined --add-host=mysql2gem.example.com:127.0.0.1'}}
          - {os: ubuntu-24.04, ruby: 'system', db: 'fedora:rawhide', distro: fedora, container: {image: 'fedora:rawhide', options: '--cap-add=SYS_PTRACE --security-opt seccomp=unconfined'}, ssl_cert_dir: '/tmp/mysql2', ssl_cert_host: 'localhost'}

          # Allow failure due to this issue:
          # https://github.com/brianmario/mysql2/issues/1194
          - {os: macos-latest, ruby: '4.0', db: mariadb@11.4, ssl: openssl@3, allow-failure: true}
          - {os: macos-latest, ruby: '4.0', db: mysql@9.7, ssl: openssl@3, allow-failure: true}          
          - {os: macos-latest, ruby: '4.0', db: mysql@8.4, ssl: openssl@3, allow-failure: true}
          - {os: macos-latest, ruby: '2.6', db: mysql@8.0, ssl: openssl@3, allow-failure: true}

      # On the fail-fast: true, it cancels all in-progress jobs
      # if any matrix job fails, which we don't want.
      fail-fast: false
    env:
      BUNDLE_WITHOUT: development
      # reduce MacOS CI time, don't need to clean a runtime that isn't saved
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
    steps:
      - uses: actions/checkout@v7
      # Skipped for Fedora: ci/fedora.sh installs Ruby via dnf instead (see
      # the matrix comment above) and runs `bundle install` itself.
      - if: matrix.distro != 'fedora'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      # Fedora already gets 127.0.0.1 mapped to mysql2gem.example.com via
      # --add-host in the container options above (rawhide's ssl_cert_host
      # is 'localhost', which needs no mapping); everything else does it here.
      - if: (runner.os == 'Linux' || runner.os == 'macOS') && matrix.distro != 'fedora'
        run: sudo echo "127.0.0.1 mysql2gem.example.com" | sudo tee -a /etc/hosts
      - if: runner.os == 'Windows'
        run: echo "127.0.0.1 mysql2gem.example.com" | tee -a C:/Windows/System32/drivers/etc/hosts
      - if: matrix.distro != 'fedora'
        run: echo 'DB=${{ matrix.db }}' >> $GITHUB_ENV
      - if: matrix.distro != 'fedora'
        run: bash ci/setup.sh
      - if: matrix.distro == 'fedora'
        run: |
          echo "TEST_RUBY_MYSQL2_SSL_CERT_DIR=${{ matrix.ssl_cert_dir || '' }}" >> $GITHUB_ENV
          echo "TEST_RUBY_MYSQL2_SSL_CERT_HOST=${{ matrix.ssl_cert_host || '' }}" >> $GITHUB_ENV
      - if: matrix.distro == 'fedora'
        run: bash ci/fedora.sh
      # Set the verbose option in the Makefile to print compiling command lines.
      - run: echo "MAKEFLAGS=V=1" >> $GITHUB_ENV
      - if: matrix.ssl
        run: echo "rake_spec_opts=--with-openssl-dir=$(brew --prefix ${{ matrix.ssl }})" >> $GITHUB_ENV
      - run: bundle exec rake spec -- $rake_spec_opts
