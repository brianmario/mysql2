name: Build (Windows)
on:
  workflow_call:
jobs:
  build:
    name: >-
      ${{ matrix.os }} ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # windows-2025's toolset preinstalls MySQL 8.0 client+server binaries
          # (mysqld.exe, mysql.exe on PATH), but no running instance -- same as
          # a fresh local dev machine, so set it up the same way ci/setup.sh
          # does for the other platforms rather than relying on a service.
          - {os: windows-2025, ruby: '3.4'}
          - {os: windows-2022, ruby: '3.0'}
      fail-fast: false
    env:
      BUNDLE_WITHOUT: development
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # setup-ruby-pkgs wraps the whole of ruby/setup-ruby itself (it isn't
      # an add-on step to run alongside a separate setup-ruby step -- doing
      # both fails, since its internal setup-ruby re-run collides trying to
      # recreate the same msys64 symlink). Use it in place of setup-ruby so
      # the mingw: package gets installed as part of that same setup.
      #
      # ruby/setup-ruby doesn't read the gemspec's msys2_mingw_dependencies
      # metadata itself (that's a RubyInstaller-GUI-only convention) -- this
      # installs the same package so mariadb_config ends up on PATH. Without
      # it, extconf.rb falls through to a fallback path that doesn't work
      # reliably on Windows (observed: crashes outright on one Ruby/mkmf
      # combination, silently succeeds via a different lookup on another).
      - uses: ruby/setup-ruby-pkgs@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false # need the MSYS2 package installed before 'bundle install' compiles the extension
          mingw: libmariadbclient
      # setup-ruby-pkgs installs the package but doesn't persist its bin/
      # directory (where mariadb_config.exe lives) onto PATH for later
      # steps, and adding it to $GITHUB_PATH by hand didn't work either --
      # RI_DEVKIT is a Windows-style path (backslashes) and MINGW_PREFIX is
      # msys-style (forward slash), and the mixed-slash result silently
      # never made it onto the runner's actual Path. Skip PATH entirely and
      # point bundler straight at the mingw prefix instead -- extconf.rb's
      # dir_config('mysql') branch (its very first check) takes this over
      # any mysql_config search, so this also sidesteps extconf.rb's
      # separate latent bug in that fallback path's dir_config defaults.
      #
      # `bundle config build.mysql2 -- --with-mysql-dir=...` (tried first)
      # writes BUNDLE_BUILD__MYSQL2 to .bundle/config -- but which config
      # file (local vs. global) depends on bundler finding a Gemfile
      # relative to cwd, one more thing to go sideways on a Windows/git-bash
      # runner, and in practice the flag silently never reached extconf.rb.
      # Since the value bundle config would have written is exactly that
      # env var already, set it directly instead -- no file or directory
      # resolution involved, just GITHUB_ENV, which every later step reads.
      - run: |
          MINGW_DIR="$(echo "$RI_DEVKIT" | tr '\\' '/')${MINGW_PREFIX}"
          echo "BUNDLE_BUILD__MYSQL2=--with-mysql-dir=$MINGW_DIR" >> "$GITHUB_ENV"
      - run: bundle install
      - name: Initialize and start MySQL
        run: |
          DATADIR="${RUNNER_TEMP}/mysql-data"
          mkdir -p "$DATADIR"
          mysqld --initialize-insecure --datadir="$DATADIR"
          mysqld --datadir="$DATADIR" --port=3306 --bind-address=127.0.0.1 \
            --pid-file="${RUNNER_TEMP}/mysqld.pid" > "${RUNNER_TEMP}/mysqld.log" 2>&1 &
          disown
      - name: Wait for MySQL and configure root user
        run: |
          for _ in $(seq 1 30); do
            mysqladmin -h127.0.0.1 -P3306 -uroot ping 2>/dev/null && break
            sleep 1
          done
          mysql -h127.0.0.1 -P3306 -uroot -e \
            "ALTER USER 'root'@'localhost' IDENTIFIED BY 'root'; CREATE DATABASE IF NOT EXISTS test;"
          mysql -h127.0.0.1 -P3306 -uroot -proot -e \
            "CREATE USER IF NOT EXISTS 'root'@'127.0.0.1' IDENTIFIED BY 'root'; GRANT ALL PRIVILEGES ON *.* TO 'root'@'127.0.0.1' WITH GRANT OPTION; FLUSH PRIVILEGES;"
      - name: Write spec/configuration.yml
        run: |
          cat > spec/configuration.yml <<'YAML'
          root:
            host: 127.0.0.1
            username: root
            password: root
            database: test
          user:
            host: 127.0.0.1
            username: root
            password: root
            database: mysql2_test
          YAML
      - run: bundle exec rake spec
